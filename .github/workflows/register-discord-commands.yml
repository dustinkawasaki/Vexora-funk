name: VEXORA release and Discord command registration

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-register:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check JavaScript syntax
        run: npm run check

      - name: Confirm automatic command registration
        run: |
          echo "Syntax check passed."
          echo "Discord slash commands are registered by the Cloudflare Worker cron every five minutes."
          echo "The protected manual endpoint is intentionally not called by this workflow."
